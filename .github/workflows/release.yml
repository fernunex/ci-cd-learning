name: Publish Release Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Define image reference
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "${{ steps.image.outputs.ref }}" .

      - name: Start release candidate
        run: |
          docker run -d \
            --name release-check \
            -e PORT=3000 \
            -p 127.0.0.1:3000:3000 \
            "${{ steps.image.outputs.ref }}"

      - name: Verify running application
        run: |
          set -euo pipefail

          ready=0

          for attempt in {1..20}; do
            if ! docker inspect -f '{{.State.Running}}' release-check | grep -q true; then
              echo "Container exited unexpectedly"
              exit 1
            fi

            if curl -fsS http://127.0.0.1:3000/health \
              | grep -Fq '"status":"healthy"'; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application did not become ready"
            exit 1
          fi

          curl -fsS 'http://127.0.0.1:3000/add?a=10&b=5' \
            | grep -Fq '"result":15'

          echo "Release image passed smoke tests!"

      - name: Authenticate with GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        run: |
          docker push "${{ steps.image.outputs.ref }}"

      - name: Show logs on failure
        if: failure()
        run: docker logs release-check || true

      - name: Clean up
        if: always()
        run: docker rm -f release-check || true

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      STAGING_URL: ${{ vars.RENDER_STAGING_URL }}

    steps:
      - name: Trigger staging deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          : "${IMAGE_REF:?Missing image reference}"
          : "${RENDER_API_KEY:?Missing Render API key}"
          : "${SERVICE_ID:?Missing staging service ID}"

          echo "Deploying image: $IMAGE_REF"

          payload=$(jq -n \
            --arg image "$IMAGE_REF" \
            '{imageUrl: $image}')

          response=$(curl --fail-with-body -sS \
            -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          deploy_id=$(jq -r '.id // empty' <<< "$response")

          if [ -z "$deploy_id" ]; then
            echo "No deploy ID returned. Inspect Render for a queued deployment."
            exit 1
          fi

          echo "Deployment ID: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for staging deployment
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail

          for attempt in {1..90}; do

            response=$(curl --fail-with-body -sS \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY")

            status=$(jq -r '.status' <<< "$response")

            echo "Attempt $attempt: deployment status = $status"

            case "$status" in
              live)
                actual_image=$(jq -r '.image.ref // empty' <<< "$response")

                if [ "$actual_image" != "$IMAGE_REF" ]; then
                  echo "Unexpected deployed image: $actual_image"
                  exit 1
                fi

                echo "Expected image is now live!"
                exit 0
                ;;

              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Staging deployment failed: $status"
                exit 1
                ;;

              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 10
                ;;

              *)
                echo "Unknown deployment status: $status"
                exit 1
                ;;
            esac
          done

          echo "Deployment did not finish before the deadline"
          exit 1

      - name: Verify live staging API
        shell: bash
        run: |
          set -euo pipefail

          : "${STAGING_URL:?Missing staging URL}"
          STAGING_URL="${STAGING_URL%/}"

          echo "Checking staging health endpoint"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$STAGING_URL/health" \
            | jq -e '.status == "healthy"'

          echo "Checking addition endpoint"

          curl --fail --silent --show-error \
            "$STAGING_URL/add?a=10&b=5" \
            | jq -e '.result == 15'

          echo "Staging deployment verified!"
