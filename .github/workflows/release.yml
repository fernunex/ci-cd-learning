
name: Publish Release Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Define image reference
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "${{ steps.image.outputs.ref }}" .

      - name: Start release candidate
        run: |
          docker run -d \
            --name release-check \
            -e PORT=3000 \
            -p 127.0.0.1:3000:3000 \
            "${{ steps.image.outputs.ref }}"

      - name: Verify running application
        run: |
          set -euo pipefail

          ready=0

          for attempt in {1..20}; do
            if ! docker inspect -f '{{.State.Running}}' release-check | grep -q true; then
              echo "Container exited unexpectedly"
              exit 1
            fi

            if curl -fsS http://127.0.0.1:3000/health \
              | grep -Fq '"status":"healthy"'; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application did not become ready"
            exit 1
          fi

          curl -fsS 'http://127.0.0.1:3000/add?a=10&b=5' \
            | grep -Fq '"result":15'

          echo "Release image passed smoke tests!"

      - name: Authenticate with GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        run: |
          docker push "${{ steps.image.outputs.ref }}"

      - name: Show logs on failure
        if: failure()
        run: docker logs release-check || true

      - name: Clean up
        if: always()
        run: docker rm -f release-check || true

